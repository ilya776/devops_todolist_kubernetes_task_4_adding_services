apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  labels:
    app: todolist
  namespace: todoapp
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    ports:
    - containerPort: 8080
    env:
      - name: DEBUG
        value: "False"
      - name: DJANGO_SECRET_KEY
        value: "super-secret"
      - name: DATABASE_NAME
        value: "todolist"
      - name: DATABASE_USER
        value: "admin"
      - name: DATABASE_PASSWORD
        value: "password"
      - name: DATABASE_HOST
        value: "mysql"
      - name: DATABASE_PORT
        value: "3306"
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5


---

apiVersion: v1
kind: Pod
metadata:
  name: todoapp2
  namespace: todoapp
  labels:
    app: todolist

spec:
  containers:
    - name: todoapp2
      image: ikulyk404/todoapp:3.0.0
      ports:
        - containerPort: 8080
      env:
        - name: DEBUG
          value: "False"
        - name: DJANGO_SECRET_KEY
          value: "super-secret"
        - name: DATABASE_NAME
          value: "todolist"
        - name: DATABASE_USER
          value: "admin"
        - name: DATABASE_PASSWORD
          value: "password"
        - name: DATABASE_HOST
          value: "mysql"
        - name: DATABASE_PORT
          value: "3306"
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 20